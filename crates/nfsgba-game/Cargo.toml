[package]
name = "nfsgba-game"
version = "0.1.0"
edition = "2024"
description = "The race game loop of NFS Carbon: Own the City (GBA): one game frame in the game's exact order"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
nfsgba-fixed = { path = "../nfsgba-fixed" }
nfsgba-formats = { path = "../nfsgba-formats" }
nfsgba-sim = { path = "../nfsgba-sim" }
nfsgba-audio = { path = "../nfsgba-audio" }

[dev-dependencies]
nfsgba-testkit = { path = "../nfsgba-testkit" }
