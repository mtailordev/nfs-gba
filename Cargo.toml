[workspace]
members = ["crates/*"]
resolver = "3"

[profile.dev.package."*"]
opt-level = 2  # dependencies (Bevy) run fast in debug builds; our own code keeps quick compiles

# The web build (`tools/web_build.py`): smaller code for the download.
[profile.web]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1

# The Android app (`tools/android_build.py`): the release build, smaller.
[profile.mobile]
inherits = "release"
lto = "thin"
codegen-units = 4
strip = true
