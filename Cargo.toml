[workspace]
members = ["crates/*"]
resolver = "3"

[profile.dev.package."*"]
opt-level = 2  # dependencies (Bevy) run fast in debug builds; our own code keeps quick compiles

# The web build (`tools/web_build.py`): smaller code for the download.
[profile.web]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
