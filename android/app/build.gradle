plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'io.github.mtailordev.nfsgba'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.mtailordev.nfsgba"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1"
        // Phones (arm64) and the x86_64 emulator; `tools/android_build.py` puts the libraries in jniLibs.
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            // Side-loaded builds: signed with the debug key (no store listing).
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        prefab true
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.games.activity
}
